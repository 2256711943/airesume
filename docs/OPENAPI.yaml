openapi: 3.1.0
info:
  title: AI Resume Assistant API
  version: 0.2.0
servers:
  - url: http://localhost:3001
paths:
  /auth/login:
    post:
      summary: User login
      responses:
        "200":
          description: OK
  /auth/logout:
    post:
      summary: User logout
      responses:
        "200":
          description: OK
  /auth/me:
    get:
      summary: Current user profile
      responses:
        "200":
          description: OK
  /resume/generate:
    post:
      summary: Generate structured resume content (Primary)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile
                - targetJob
              properties:
                profile:
                  type: object
                  description: Candidate base profile data
                targetJob:
                  type: object
                  description: Target role / JD context
                tone:
                  type: string
                  description: Resume tone, e.g. concise/professional
                language:
                  type: string
                  description: Output language, e.g. zh-CN/en-US
      responses:
        "200":
          description: OK
  /resume/generate/stream:
    get:
      summary: Generate structured resume content via SSE stream
      responses:
        "200":
          description: text/event-stream
  /conversations/{conversationId}/resume-session:
    get:
      summary: Restore resume session state in one request
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: OK
